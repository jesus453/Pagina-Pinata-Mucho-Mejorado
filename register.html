    <h1> Registrarse </h1>
    <form action="/" method="get"> 
      <label for="nombre"> Nombre: </label><br>
      <input type="text" name="nombre" placeholder="Ingrese su nombre" required><br><br><br> 

      <label for="apellido"> Apellido: </label><br> 
      <input type="text" name="apellido" placeholder="Ingrese su apellido" required><br><br><br>

      <label for="correo"> Correo electrónico: </label><br>
      <input type="email" name="correo" placeholder="Ingrese su correo" requiered><br><br><br>

      <label for="contrasena"> Contraseña: </label><br>
      <input type="password" name="contrasena" placeholder="Ingrese su contraseña" required><br><br><br> 

      <label for="confirmar"> Confirme contraseña: </label><br>
      <input type="password" name="confirmar" placeholder="Confirme su contraseña" required><br><br><br>

      <button class="button" type="submit" > Enviar </button>
    </form>
    <br>
